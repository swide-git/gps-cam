<!doctype html>
<!-- Google Play feature graphic (1024x500), rendered to play_feature_graphic.png with headless
     Chrome (scripts/render-store-graphics.sh). Same layout as the Second Display one. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 25% 40%, #FFF1E8 0%, #FFDCC2 70%, #FFCFA8 100%);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; align-items: center;
  }
  svg { width: 300px; height: 300px; margin-left: 120px; flex: none; }
  .text { margin-left: 50px; }
  h1 { margin: 0; font-size: 104px; line-height: 0.98; font-weight: 700; letter-spacing: -2px; }
  h1 .a { color: #904D00; display: block; }
  h1 .b { color: #2F1500; display: block; }
  p { margin: 22px 0 0; font-size: 27px; line-height: 1.35; color: #52443B; font-weight: 600; }
</style></head><body>
  <svg viewBox="16 14 76 76">
    <path d="M33.8,74.2 A28.5,28.5 0 1 1 74.2,74.2" fill="none" stroke="#FF9F43" stroke-width="7" stroke-linecap="round"/>
    <path d="M54,56 L70,38" fill="none" stroke="#904D00" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="54" cy="56" r="8" fill="#904D00"/>
  </svg>
  <div class="text">
    <h1><span class="a">GPS</span><span class="b">Cam</span></h1>
    <p>Real speed from GPS, live satellites<br>and video with your speed in it</p>
  </div>
</body></html>
